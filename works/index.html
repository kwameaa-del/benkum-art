<script>
// Fade artwork in once decoded, so frames never flash a half-drawn image.
document.documentElement.classList.add("js-fade");
document.addEventListener("load", markLoaded, true);
document.addEventListener("error", markLoaded, true);
function markLoaded(e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains("piece-img")) t.classList.add("is-loaded");
}
</script>
<style>
  /* Follow menu: Instagram or Facebook */
  .site-nav .follow { position: relative; }
  .site-nav summary { list-style: none; cursor: pointer; }
  .site-nav summary::-webkit-details-marker { display: none; }
  .site-nav .follow[open] > summary { color: var(--accent); }
  .site-nav .follow-pop {
    position: absolute; right: 0; top: 100%; z-index: 30;
    display: flex; flex-direction: column; min-width: 150px; padding: 6px 0;
    background: var(--bg, #141414); border: 1px solid var(--border, var(--line, rgba(237, 234, 226, 0.16)));
  }
  .site-nav .follow-pop a { padding: 10px 16px; }
</style>
<script>
  // Close the Follow menu on an outside click or Escape
  document.addEventListener("click", function (e) {
    document.querySelectorAll("details.follow[open]").forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    document.querySelectorAll("details.follow[open]").forEach(function (d) { d.open = false; d.querySelector("summary").focus(); });
  });
</script>

<body>
<style>
  :root {
    --bg: #141414;
    --ink: #EDEAE2;
    --ink-soft: #ABA79E;
    --ink-faint: #7A766D;
    --border: rgba(237, 234, 226, 0.16);
    --accent: #EAAE45;
    --focus: #EAAE45;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Newsreader", Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .wrap { width: min(90vw, 1650px); margin: 0 auto; padding: 0 32px; }

  /* ---------- Gallery ---------- */
  .stack {
    column-count: 1;
    column-gap: 56px;
    padding: 72px 0 0;
  }
  @media (min-width: 780px) {
    .stack { column-count: 2; }
  }
  .stack .piece {
    break-inside: avoid;
    margin: 0 0 56px;
  }
  .gallery-more {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 28px;
    padding: 8px 0 56px;
  }
  .gallery-newer {
    font: italic 16px "Newsreader", serif;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 10px 4px;
    cursor: pointer;
  }
  .gallery-newer:hover { color: var(--accent); }
  .load-more-btn {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 15px;
    color: var(--accent);
    background: rgba(234, 174, 69, 0.08);
    border: 1px solid rgba(234, 174, 69, 0.45);
    border-radius: 999px;
    cursor: pointer;
    padding: 10px 28px;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .load-more-btn:hover {
    background: rgba(234, 174, 69, 0.16);
    border-color: var(--accent);
    color: var(--ink);
  }
  .piece-title {
    margin: 0 2px 18px;
    font-family: "Newsreader", serif;
    font-weight: 500;
    font-style: italic;
    font-size: 26px;
    letter-spacing: 0.005em;
    color: var(--ink);
    text-align: center;
  }
  .piece-frame {
    position: relative;
    background: #E9E4D8;
    padding: clamp(8px, 1.5vw, 16px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  .piece-frame img {
    width: 100%;
    height: auto;
    object-fit: contain;
    aspect-ratio: auto;
    display: block;
    cursor: zoom-in;
  }
  .piece-cap {
    display: block;
    margin: 18px auto 0;
    font-size: 15px;
    font-style: italic;
    color: var(--ink);
    max-width: 62ch;
    text-align: center;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(234, 174, 69, 0.55);
    text-underline-offset: 3px;
    transition: color 0.35s ease, text-decoration-color 0.35s ease;
  }
  .piece-cap:hover { color: var(--accent); text-decoration-color: rgba(234, 174, 69, 0.9); }
  .piece-cap.is-active {
    color: var(--accent);
    text-decoration-color: var(--accent);
    transition: color 0.15s ease, text-decoration-color 0.15s ease;
  }

  /* ---------- Story view ---------- */
  .story-view {
    padding: 72px 0 64px;
  }
  .story-back {
    display: inline-block;
    margin-bottom: 56px;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .story-back:hover { color: var(--ink); }
  .story-title {
    margin: 0 2px 26px;
    font-family: "Newsreader", serif;
    font-weight: 500;
    font-style: italic;
    font-size: 28px;
    letter-spacing: 0.005em;
    color: var(--ink);
    text-align: center;
  }
  .story-frame {
    position: relative;
    background: #E9E4D8;
    padding: clamp(8px, 1.5vw, 16px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    max-width: 860px;
    margin: 0 auto 24px;
  }
  .story-frame img {
    width: 100%;
    height: auto;
    object-fit: contain;
    aspect-ratio: auto;
    display: block;
    cursor: zoom-in;
  }
  .piece-frame.marked::before,
  .story-frame.marked::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 5px;
    width: 12px;
    height: 12px;
    border-top: 1.5px solid var(--accent);
    border-left: 1.5px solid var(--accent);
    opacity: 0.85;
    pointer-events: none;
  }
  .piece-frame.marked-b::after,
  .story-frame.marked-b::after {
    content: "";
    position: absolute;
    right: 5px;
    bottom: 5px;
    width: 12px;
    height: 12px;
    border-bottom: 1.5px solid var(--accent);
    border-right: 1.5px solid var(--accent);
    opacity: 0.85;
    pointer-events: none;
  }
  .story-cap {
    margin: 0 auto;
    font-size: 15px;
    font-style: italic;
    color: var(--ink-soft);
    max-width: 52ch;
    text-align: center;
  }
  .story-reading-pause {
    height: clamp(48px, 7vw, 88px);
  }
  .story-text {
    margin: 0 auto;
    max-width: 60ch;
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink);
  }
  .story-text p { margin: 0 0 1.2em; }
  .story-text p:last-child { margin-bottom: 0; }
  .story-glyph {
    display: flex;
    justify-content: center;
    margin: 48px auto 0;
    cursor: default;
  }
  .story-glyph svg { display: block; }
  .story-nav {
    max-width: 60ch;
    margin: 64px auto 0;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .story-next {
    display: block;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
    text-decoration: none;
    margin-bottom: 20px;
  }
  .story-next:hover { color: var(--accent); }
  .story-return {
    display: inline-block;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .story-return:hover { color: var(--ink); }

  /* ---------- About ---------- */
  .about-view {
    position: relative;
    overflow: hidden;
    padding: 96px 0 80px;
    max-width: 46ch;
    margin: 0 auto;
    text-align: center;
  }
  .about-poem {
    position: relative;
    z-index: 1;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 18px;
    line-height: 2;
    color: var(--ink);
  }
  .about-poem p { margin: 0 0 1.6em; }
  .about-poem p:last-child { margin-bottom: 0; color: var(--accent); }
  .about-prose {
    position: relative;
    z-index: 1;
    margin: 64px auto 0;
    padding-top: 48px;
    border-top: 1px solid var(--border);
    font-size: 17px;
    line-height: 1.8;
    color: var(--ink);
  }
  .about-hand {
    width: min(260px, 72%);
    margin: 56px auto 0;
    padding: 14px;
    background: #E9E4D8;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
  }
  .about-hand img { display: block; width: 100%; height: auto; }
  .about-prose p { margin: 0 0 1.3em; }
  .about-prose p:last-child { margin-bottom: 0; }
  .about-prose em { color: var(--accent); }
  .about-now {
    position: relative;
    z-index: 1;
    margin: 48px auto 0;
    padding: 22px 24px;
    border: 1px solid var(--border);
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .about-now p { margin: 0; }
  .about-now .about-now-label {
    margin-bottom: 8px;
    font-family: "Archivo", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .about-contact {
    position: relative;
    z-index: 1;
    margin: 40px 0 0;
    font-size: 15px;
    font-style: italic;
    color: var(--ink-soft);
  }
  .about-contact a {
    text-decoration: none;
    border-bottom: 1px solid rgba(234, 174, 69, 0.55);
  }
  .about-contact a:hover { color: var(--accent); }
  .about-glyph-fragment {
    position: absolute;
    z-index: 0;
    right: clamp(-140px, -22vw, -70px);
    bottom: clamp(-120px, -18vw, -60px);
    width: clamp(220px, 46vw, 360px);
    aspect-ratio: 1;
    color: var(--accent);
    opacity: 0.08;
    transform: rotate(-11deg);
    pointer-events: none;
    user-select: none;
  }
  .about-glyph-fragment svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .about-back {
    display: block;
    margin-top: 64px;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .about-back:hover { color: var(--ink); }
  .foot-about-link {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid rgba(171, 167, 158, 0.55);
    cursor: pointer;
  }
  .foot-about-link:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px;
    z-index: 1000;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: none;
    display: block;
  }
  .lightbox-close {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    right: 22px;
    min-width: 44px;
    min-height: 44px;
    background: none;
    border: 0;
    color: var(--ink);
    font: 32px Georgia, serif;
    line-height: 1;
    cursor: pointer;
  }
  .lightbox-close:hover { color: var(--accent); }

  /* Empty state */
  .empty {
    padding: 120px 0;
    text-align: center;
  }
  .empty-sub {
    font-size: 15px;
    font-style: italic;
    color: var(--ink-faint);
  }

  footer.site-foot {
    border-top: 1px solid var(--border);
    padding: 26px 0 56px;
  }
  .signature {
    margin: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    line-height: 1;
  }
  .sig-gold {
    background: linear-gradient(160deg, #F5D48A 0%, #C89430 22%, #7A4E12 45%, #E8BE6A 62%, #B9791A 80%, #F0CE7E 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .sig-word {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .sig-script {
    font-family: "Alex Brush", cursive;
    font-size: 30px;
    line-height: 0.6;
    margin-left: 3px;
  }
  .sig-logo-img {
    height: 26px;
    width: auto;
    display: block;
  }
  .sig-attribution {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-faint);
    margin-left: 6px;
    line-height: 1;
  }
  .foot-caption {
    margin: 3px 0 0;
    line-height: 1.3;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-faint);
  }
  .foot-disclosure {
    margin: 12px 0 0;
    line-height: 1.3;
    font-family: "Newsreader", serif;
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    opacity: 0.62;
  }

  /* ---------- Site header (real, crawlable brand heading) ---------- */
  .site-head {
    padding: 40px 0 0;
  }
  .site-head-link {
    display: inline-block;
    text-decoration: none;
  }
  .site-head-title {
    margin: 0;
    font-family: "Archivo", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .site-head-link:hover .site-head-title { color: var(--accent); }

  /* ---------- Artwork page (standalone, non-hash pages) ---------- */
  .art-back {
    display: inline-block;
    margin: 28px 0 0;
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .art-back:hover { color: var(--ink); }

  /* ---------- Image loading ---------- */
  /* Dark mat inside the frame shows while the image loads, instead of bare white. */
  .piece-frame, .story-frame {
    background: linear-gradient(#1F1D1A, #1F1D1A) content-box, #E9E4D8;
  }
  .js-fade .piece-img { opacity: 0; transition: opacity 0.45s ease; }
  .js-fade .piece-img.is-loaded { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .js-fade .piece-img { transition: none; }
  }

  /* ---------- Top links ---------- */
  .site-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .site-nav { display: flex; gap: 22px; }
  .site-nav a, .site-nav summary {
    font-family: "Archivo", sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 10px 0;
  }
  .site-nav a:hover, .site-nav summary:hover { color: var(--accent); }
  @media (max-width: 420px) { .site-nav { gap: 16px; } .site-nav a, .site-nav summary { font-size: 11px; } }

  /* ---------- Email signup ---------- */
  .signup { max-width: 46ch; margin: 64px auto 0; padding-top: 36px; border-top: 1px solid var(--border); text-align: center; }
  .signup-line { margin: 0 0 16px; font-family: "Newsreader", serif; font-style: italic; font-size: 17px; color: var(--ink); }
  .signup-form { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .signup-form input {
    flex: 1 1 200px; max-width: 280px; min-height: 44px; padding: 0 14px;
    font: 15px "Newsreader", Georgia, serif; color: var(--ink);
    background: rgba(237, 234, 226, 0.05); border: 1px solid var(--border); border-radius: 999px;
  }
  .signup-form input::placeholder { color: var(--ink-faint); font-style: italic; }
  .signup-form input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .signup-form button {
    min-height: 44px; padding: 0 22px; cursor: pointer;
    font: italic 15px "Newsreader", serif; color: var(--accent);
    background: rgba(234, 174, 69, 0.08); border: 1px solid rgba(234, 174, 69, 0.45); border-radius: 999px;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .signup-form button:hover { background: rgba(234, 174, 69, 0.16); border-color: var(--accent); color: var(--ink); }
  .signup-notice {
    margin: 28px auto 0; padding: 14px 20px; max-width: 46ch; text-align: center;
    font-style: italic; font-size: 16px; color: var(--accent);
    border: 1px solid rgba(234, 174, 69, 0.45); border-radius: 999px;
  }
  .signup-note { margin: 12px 0 0; font-size: 13px; font-style: italic; color: var(--ink-faint); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Readability ---------- */
  /* Newsreader has a small x-height; sizes run ~2px larger than a typical
     face would need, and the optical-size axis gives sturdier letters at
     reading sizes. Faint grey lifted from 4.1:1 to ~6:1 contrast. */
  :root { --ink-faint: #9A968D; }
  body { font-optical-sizing: auto; }
  .story-text { font-size: 19px; line-height: 1.7; }
  .story-cap, .piece-cap { font-size: 17px; }
  .story-back, .story-return { font-size: 15px; }
  .story-next { font-size: 19px; }
  .about-poem { font-size: 20px; }
  .about-prose { font-size: 19px; }
  .about-now { font-size: 16px; }
  .about-contact { font-size: 16px; }
  .signup-line { font-size: 18px; }
  .signup-note, .foot-caption { font-size: 14px; }
  .foot-disclosure { font-size: 12px; opacity: 1; }
  .site-nav a, .site-nav summary { font-size: 13px; }
  .load-more-btn { font-size: 16px; }
  @media (max-width: 600px) {
    .story-text, .about-prose { font-size: 18px; }
  }
  @media (max-width: 420px) {
    .site-nav a, .site-nav summary { font-size: 12px; }
  }

  /* ---------- Write to me (inquiry form) ---------- */
  .inquiry { position: relative; z-index: 1; margin: 56px auto 0; padding-top: 44px; border-top: 1px solid var(--border); text-align: left; }
  .inquiry-heading { margin: 0 0 10px; text-align: center; font: italic 500 26px "Newsreader", serif; color: var(--ink); }
  .inquiry-intro { margin: 0 0 28px; text-align: center; font-size: 17px; font-style: italic; line-height: 1.6; color: var(--ink-soft); }
  .inquiry-lead { text-align: center; }
  .inquiry-lead .about-contact { margin: 0 0 28px; }
  .inquiry-form { display: grid; gap: 16px; }
  .inquiry-form .field { display: grid; gap: 6px; }
  .inquiry-pair { display: grid; gap: 16px; }
  .inquiry-form label { font: 600 11px "Archivo", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .inquiry-optional { font-weight: 500; letter-spacing: 0.04em; text-transform: none; color: var(--ink-faint); }
  .inquiry-form input:not([type=hidden]):not([type=checkbox]), .inquiry-form select, .inquiry-form textarea {
    width: 100%; min-height: 44px; padding: 10px 14px;
    font: 17px "Newsreader", Georgia, serif; color: var(--ink);
    background: rgba(237, 234, 226, 0.05); border: 1px solid var(--border); border-radius: 10px;
  }
  .inquiry-form select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
